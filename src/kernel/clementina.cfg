# ============================================================================
# clementina.cfg - linker config for the combined Clementina image
# ----------------------------------------------------------------------------
# 2026-09 bottom-anchor rework (reversing the earlier top-anchored/descending-
# loader design): the loaded image (kernel + WozMon + BASIC) is anchored to a
# fixed LOW start, $04B7 (right after working RAM: zero page, stack, line
# buffer, KVARS, BGP_*/DIR_NAME_BUF), and grows upward. Two chained MEMORY
# regions give a real, linker-checked split instead of an accident of file
# order:
#
#   KERNEL   - kernel.s + wozmon-clementina.s, fixed start ($04B7), ending
#              wherever their content ends. Jump table is placed FIRST so it
#              always starts exactly at $04B7, never moving as kernel code
#              grows. Permanently resident - never a load target.
#   BASICMEM - basic.s (core + tables + extensions), starting immediately
#              after KERNEL ends (__KERNEL_LAST__, ld65-defined: first free
#              byte past KERNEL's actual content). Reclaimable: a program
#              that no longer needs BASIC can load straight over it, up
#              through $BFFF, once it's done using it to load itself.
#
# kernel.s/wozmon-clementina.s use their OWN "KERNCODE"/"WOZCODE" segment
# names instead of the shared "CODE" every msbasic platform (including
# Clementina's own basic.s) uses - this is what lets KERNEL's region contain
# only kernel+WozMon code, with nothing from BASIC merged into it by link-file
# order. See kernel.s's segment comment and docs/memory-map.md.
#
# Both regions place everything in one ld65 pass - no two-pass "measure, then
# relink" build needed (that was only required for the old design's fixed
# END anchor, where the START had to be computed backward from the total
# size; anchoring at a fixed START lets ld65 place things forward natively).
# ============================================================================

MEMORY {
    # BASIC owns low/mid zero page; the kernel keeps a small high block.
    BASICZP: start = $0000, size = $00F0, type = rw, define = yes;
    KZP:     start = $00F0, size = $0010, type = rw, define = yes;

    # Kernel + WozMon: fixed low anchor, permanently resident. Sized
    # generously (up to $1000, 2.75 KiB more than today's ~3.4 KiB actual
    # use) - ld65 fails loudly if real content ever exceeds it, so this is
    # a soft ceiling to bump on demand, not a byte-exact budget to maintain.
    KERNEL:   start = $04B7, size = $1000, type = rw, file = %O, fill = no, define = yes;

    # BASIC's own core+tables+extensions: starts immediately after KERNEL's
    # actual content ends, grows up to $BFFF (immediately below I/O).
    BASICMEM: start = __KERNEL_LAST__, size = $C000 - __KERNEL_LAST__, type = rw, file = %O, fill = no, define = yes;

    DUMMY: start = $0000, size = $00FF, type = rw, file = "";
}

SEGMENTS {
    ZEROPAGE:  load = BASICZP, type = zp,  optional = yes;
    KZEROPAGE: load = KZP,     type = zp,  optional = yes;

    # Placed FIRST on purpose: whatever's listed first lands at the lowest
    # address, so JUMPTAB always starts exactly at $04B7 (KERNEL's fixed
    # start) regardless of how much kernel/WozMon code follows it. This is
    # what keeps KERN_BASE (kernel.inc) a true fixed constant.
    JUMPTAB:   load = KERNEL,   type = ro;
    KERNCODE:  load = KERNEL,   type = ro;
    RODATA:    load = KERNEL,   type = ro,  optional = yes;
    WOZCODE:   load = KERNEL,   type = ro,  optional = yes;

    # BASIC's own tables/code - all in BASICMEM, the reclaimable region.
    CODE:      load = BASICMEM, type = ro;
    HEADER:    load = BASICMEM, type = ro;
    VECTORS:   load = BASICMEM, type = ro;
    KEYWORDS:  load = BASICMEM, type = ro;
    EXTVEC:    load = BASICMEM, type = ro,  optional = yes;   # extension token address table
    EXTKEYW:   load = BASICMEM, type = ro,  optional = yes;   # extension keyword name table
    EXTFNVEC:  load = BASICMEM, type = ro,  optional = yes;   # extension FUNCTION token address table
    EXTFNKEYW: load = BASICMEM, type = ro,  optional = yes;   # extension FUNCTION keyword name table
    EXT2VEC:   load = BASICMEM, type = ro,  optional = yes;   # extension token address table #2 (TOKEN_EXT2 - EXTVEC/EXTKEYW's budget filled up)
    EXT2KEYW:  load = BASICMEM, type = ro,  optional = yes;   # extension keyword name table #2
    ERROR:     load = BASICMEM, type = ro;
    CHRGET:    load = BASICMEM, type = ro;
    INIT:      load = BASICMEM, type = ro;
    EXTRA:     load = BASICMEM, type = ro;

    DUMMY:     load = DUMMY,  optional = yes;
}
