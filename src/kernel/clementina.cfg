# ============================================================================
# clementina.cfg - linker config for the combined Clementina image
# ----------------------------------------------------------------------------
# 2026-09 RAM/ROM reorg: the loaded image (kernel + BASIC + WozMon) no longer
# sits between working RAM and the heap. It now lives at the TOP of the flat
# address space, ending exactly at $BFFF (immediately below I/O), with
# JUMPTAB placed LAST so it always lands on the top 48 bytes, $BFD0-$BFFF -
# fixed forever, regardless of how large the rest of the image grows.
#
# __CODE_START__/__CODE_SIZE__ are passed in via `ld65 -D` by the Makefile's
# two-pass build: pass 1 links with a throwaway placement just to measure the
# image's total size, then pass 2 relinks with __CODE_START__ computed as
# $C000 - <measured size>, so the image's last byte always lands on $BFFF
# with zero wasted address space, no matter how the image grows or shrinks.
#
# BASIC's heap fills everything between RAMSTART2 (defines_clementina.s, a
# small fixed constant just above the working-RAM block: zero page, stack,
# line buffer, KVARS, BGP_*/DIR_NAME_BUF) and __MAIN_START__ (this region's
# start, read directly by init.s instead of a runtime RAM probe - probing
# into this region would scribble test patterns into live, running code).
#
# IMPORTANT: the MIA bootstrap loader writes DESCENDING, starting at a fixed
# $BFFF and decrementing - not the classic ascending-from-$0400 loader. Both
# clementina-mia (mia.c: kernel_load_top_address/kernel_target_address) and
# clementina-6502 (registers.go: miaKernelLoadTopAddress/miaKernelTargetAddress)
# must have kernel_load_top_address = 0xBFFF and kernel_target_address =
# 0xBFD0 (the jump table's start - also the RESET/NMI/IRQ vector target).
# See docs/memory-map.md.
# ============================================================================

MEMORY {
    # BASIC owns low/mid zero page; the kernel keeps a small high block.
    BASICZP: start = $0000, size = $00F0, type = rw, define = yes;
    KZP:     start = $00F0, size = $0010, type = rw, define = yes;

    # The loaded image: kernel + WozMon + BASIC, ending exactly at $BFFF.
    # start/size come from the Makefile's two-pass link (see header comment).
    MAIN:  start = __CODE_START__, size = __CODE_SIZE__, type = rw, file = %O, fill = no, define = yes;
    DUMMY: start = $0000, size = $00FF, type = rw, file = "";
}

SEGMENTS {
    ZEROPAGE:  load = BASICZP, type = zp,  optional = yes;
    KZEROPAGE: load = KZP,     type = zp,  optional = yes;

    # Kernel code + its read-only data first.
    CODE:      load = MAIN,   type = ro;
    RODATA:    load = MAIN,   type = ro,  optional = yes;

    # BASIC's own tables/code.
    HEADER:    load = MAIN,   type = ro;
    VECTORS:   load = MAIN,   type = ro;
    KEYWORDS:  load = MAIN,   type = ro;
    EXTVEC:    load = MAIN,   type = ro,  optional = yes;   # extension token address table
    EXTKEYW:   load = MAIN,   type = ro,  optional = yes;   # extension keyword name table
    EXTFNVEC:  load = MAIN,   type = ro,  optional = yes;   # extension FUNCTION token address table
    EXTFNKEYW: load = MAIN,   type = ro,  optional = yes;   # extension FUNCTION keyword name table
    EXT2VEC:   load = MAIN,   type = ro,  optional = yes;   # extension token address table #2 (TOKEN_EXT2 - EXTVEC/EXTKEYW's budget filled up)
    EXT2KEYW:  load = MAIN,   type = ro,  optional = yes;   # extension keyword name table #2
    ERROR:     load = MAIN,   type = ro;
    CHRGET:    load = MAIN,   type = ro;
    INIT:      load = MAIN,   type = ro;
    EXTRA:     load = MAIN,   type = ro;

    # Placed LAST on purpose: whatever's listed last lands at the highest
    # addresses, so JUMPTAB always ends up at $BFD0-$BFFF regardless of how
    # much kernel/WozMon/BASIC code precedes it. This is what keeps KERN_BASE
    # (kernel.inc) a true fixed constant even as the rest of the image grows.
    JUMPTAB:   load = MAIN,   type = ro;

    DUMMY:     load = DUMMY,  optional = yes;
}
